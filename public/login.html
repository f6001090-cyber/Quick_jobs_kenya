<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Quick Jobs Kenya</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #101820;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 24px;
        }

        .brand span {
            color: #16a34a;
        }

        .brand p {
            color: #aeb8bf;
            margin-top: 6px;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .card h2 {
            color: #17202a;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #68737d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #34404a;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dedb;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #16a34a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #12803a;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .error {
            background: #fdecec;
            color: #a61b1b;
        }

        .success {
            background: #eaf8ef;
            color: #176b34;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #68737d;
        }

        .register a {
            color: #16a34a;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            text-align: center;
            margin-top: 18px;
        }

        .back a {
            color: #aeb8bf;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand">
        <h1>QUICK <span>JOBS</span> KENYA</h1>
        <p>Welcome back</p>
    </div>

    <div class="card">

        <h2>Login</h2>

        <p class="subtitle">
            Sign in to access your Quick Jobs Kenya account.
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="e.g. 0712345678"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register.html">Create Account</a>
        </div>

    </div>

    <div class="back">
        <a href="/">← Back to Quick Jobs Kenya</a>
    </div>

</div>


<script>

const form = document.getElementById("loginForm");
const message = document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    showMessage("Signing you in...", "success");


    const data = {

        phone:
            document.getElementById("phone").value.trim(),

        password:
            document.getElementById("password").value

    };


    try {

        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();


        if (!result.success) {

            showMessage(
                result.message || "Login failed.",
                "error"
            );

            return;
        }


        // Save authentication token
        localStorage.setItem(
            "qjk_token",
            result.token
        );


        // Save user information
        localStorage.setItem(
            "qjk_user",
            JSON.stringify(result.user)
        );


        showMessage(
            "Login successful! Opening your dashboard...",
            "success"
        );


        setTimeout(() => {

            if (result.user.role === "admin") {

                window.location.href =
                    "/admin.html";

            } else if (result.user.role === "client") {

                window.location.href =
                    "/client.html";

            } else {

                window.location.href =
                    "/worker.html";

            }

        }, 1000);


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );

    }

});

</script>

</body>
</html>
