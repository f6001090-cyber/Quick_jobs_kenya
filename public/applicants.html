<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Applicants - Quick Jobs Kenya</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    width: 94%;
    max-width: 900px;
    margin: 20px auto;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    padding: 11px 15px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
}

.back {
    background: #374151;
    color: white;
}

.hire {
    background: #16a34a;
    color: white;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

.info {
    color: #555;
    margin: 8px 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #e5e7eb;
}

.status.pending {
    background: #fef3c7;
    color: #92400e;
}

.status.accepted,
.status.hired {
    background: #dcfce7;
    color: #166534;
}

.status.rejected {
    background: #fee2e2;
    color: #991b1b;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    color: #666;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.success {
    background: #dcfce7;
    color: #166534;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    padding: 30px;
}
</style>
</head>

<body>

<header>
    <h1>👥 Job Applicants</h1>
</header>

<div class="container">

    <div class="actions">
        <a href="/client-my-jobs.html" class="btn back">
            ← My Jobs
        </a>

        <a href="/client.html" class="btn back">
            Client Dashboard
        </a>
    </div>

    <div id="message"></div>

    <div id="applicants">
        <div class="loading">
            Loading applicants...
        </div>
    </div>

</div>

<script>

const token = localStorage.getItem("qjk_token");

if (!token) {
    window.location.href = "/login.html";
}

const params = new URLSearchParams(window.location.search);
const jobId = params.get("job_id");

if (!jobId) {

    document.getElementById("applicants").innerHTML = `
        <div class="error">
            No job ID was provided.
        </div>
    `;

} else {

    loadApplicants();
}


async function loadApplicants() {

    const container = document.getElementById("applicants");
    const message = document.getElementById("message");

    try {

        const response = await fetch(
            "/api/job-applications/" + encodeURIComponent(jobId),
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            container.innerHTML = "";

            message.innerHTML = `
                <div class="error">
                    ${escapeHTML(
                        data.message || "Unable to load applicants."
                    )}
                </div>
            `;

            return;
        }

        if (!data.applications || data.applications.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No applicants yet</h3>
                    <p>
                        Workers who apply for this job will appear here.
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        data.applications.forEach(application => {

            const card = document.createElement("div");

            card.className = "card";

            const status =
                String(application.status || "pending")
                    .toLowerCase();

            card.innerHTML = `

                <h2>
                    ${escapeHTML(
                        application.worker_name || "Worker"
                    )}
                </h2>

                <p class="info">
                    <strong>Worker ID:</strong>
                    ${application.worker_id}
                </p>

                <p class="info">
                    <strong>Phone:</strong>
                    ${escapeHTML(
                        application.worker_phone || "Not provided"
                    )}
                </p>

                <p class="info">
                    <strong>Application message:</strong><br>
                    ${escapeHTML(
                        application.message || "No message"
                    )}
                </p>

                <p class="info">
                    <strong>Applied:</strong>
                    ${escapeHTML(
                        application.created_at || ""
                    )}
                </p>

                <p>
                    <span class="status ${status}">
                        ${escapeHTML(
                            application.status || "pending"
                        )}
                    </span>
                </p>

                ${
                    status === "pending"
                    ? `
                        <button
                            class="btn hire"
                            onclick="hireWorker(
                                ${application.worker_id},
                                ${application.id}
                            )">
                            ✓ Hire Worker
                        </button>
                    `
                    : ""
                }

            `;

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = "";

        message.innerHTML = `
            <div class="error">
                Unable to connect to the server.
            </div>
        `;
    }
}


async function hireWorker(workerId, applicationId) {

    const confirmed = confirm(
        "Are you sure you want to hire this worker?"
    );

    if (!confirmed) {
        return;
    }

    const message = document.getElementById("message");

    try {

        const response = await fetch("/api/hire", {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },

            body: JSON.stringify({
                application_id: Number(applicationId)
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {

            message.innerHTML = `
                <div class="error">
                    ${escapeHTML(
                        data.message || "Could not hire worker."
                    )}
                </div>
            `;

            return;
        }

        message.innerHTML = `
            <div class="success">
                Worker hired successfully.
            </div>
        `;

        await loadApplicants();

    } catch (error) {

        console.error(error);

        message.innerHTML = `
            <div class="error">
                Unable to connect to the server.
            </div>
        `;
    }
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
