<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Completed Jobs - Quick Jobs Kenya</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    width: 94%;
    max-width: 900px;
    margin: 20px auto;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.btn {
    display: inline-block;
    padding: 11px 15px;
    border-radius: 8px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

.back {
    background: #374151;
    color: white;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h2 {
    margin-top: 0;
}

.info {
    color: #555;
    margin: 8px 0;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.completed {
    background: #fef3c7;
    color: #92400e;
}

.paid {
    background: #dcfce7;
    color: #166534;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #666;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    padding: 30px;
}
</style>
</head>

<body>

<header>
    <h1>✅ Completed Jobs</h1>
</header>

<div class="container">

    <div class="actions">

        <a href="/client.html" class="btn back">
            ← Client Dashboard
        </a>

        <a href="/client-my-jobs.html" class="btn back">
            📋 My Jobs
        </a>

    </div>

    <div id="message"></div>

    <div id="jobs">

        <div class="loading">
            Loading completed jobs...
        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("qjk_token");

if (!token) {
    window.location.href = "/login.html";
}


async function loadCompletedJobs() {

    const container =
        document.getElementById("jobs");

    const message =
        document.getElementById("message");

    try {

        const response = await fetch(
            "/api/client-completed-jobs",
            {
                headers: {
                    "Authorization":
                        "Bearer " + token
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            container.innerHTML = "";

            message.innerHTML = `
                <div class="error">
                    ${escapeHTML(
                        data.message ||
                        "Unable to load completed jobs."
                    )}
                </div>
            `;

            return;
        }


        if (
            !data.jobs ||
            data.jobs.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">

                    <h3>No completed jobs</h3>

                    <p>
                        Jobs completed by workers
                        will appear here.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        data.jobs.forEach(job => {

            const status =
                String(job.status || "")
                    .toLowerCase();


            const card =
                document.createElement("div");

            card.className = "card";


            card.innerHTML = `

                <h2>
                    ${escapeHTML(
                        job.title
                    )}
                </h2>

                <p class="info">
                    <strong>Category:</strong>
                    ${escapeHTML(
                        job.category ||
                        "Not specified"
                    )}
                </p>

                <p class="info">
                    <strong>Budget:</strong>
                    KSh ${Number(
                        job.budget || 0
                    ).toLocaleString()}
                </p>

                <p class="info">
                    <strong>Description:</strong><br>
                    ${escapeHTML(
                        job.description ||
                        "No description"
                    )}
                </p>

                <p class="info">
                    <strong>Worker ID:</strong>
                    ${job.hired_worker_id || "N/A"}
                </p>

                <p class="info">
                    <strong>Posted:</strong>
                    ${escapeHTML(
                        job.created_at || ""
                    )}
                </p>

                <p>

                    <span class="status ${status}">

                        ${escapeHTML(
                            job.status ||
                            "completed"
                        )}

                    </span>

                </p>

                ${
                    status === "completed"
                    ? `
                        <button
                            class="btn"
                            style="background:#16a34a;color:white;"
                            onclick="confirmPayment(${job.id})">
                            💰 Confirm & Pay Worker
                        </button>
                    `
                    : `
                        <p style="color:#166534;font-weight:bold;">
                            ✓ Worker has already been paid.
                        </p>
                    `
                }

            `;

            container.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        container.innerHTML = "";

        message.innerHTML = `
            <div class="error">
                Unable to connect to the server.
            </div>
        `;
    }
}


async function confirmPayment(jobId) {

    const confirmed = confirm(
        "Confirm that this job was completed and pay the worker?"
    );

    if (!confirmed) {
        return;
    }

    const message =
        document.getElementById("message");

    try {

        const response = await fetch(
            "/api/jobs/" + jobId + "/confirm",
            {
                method: "POST",

                headers: {
                    "Authorization":
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"
                }
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            message.innerHTML = `
                <div class="error">
                    ${escapeHTML(
                        data.message ||
                        "Could not confirm payment."
                    )}
                </div>
            `;

            return;
        }

        message.innerHTML = `
            <div style="
                background:#dcfce7;
                color:#166534;
                padding:15px;
                border-radius:10px;
                margin-bottom:15px;
            ">
                ✓ Worker paid successfully.
                <br>
                Worker received:
                KSh ${Number(
                    data.worker_earnings || 0
                ).toLocaleString()}
            </div>
        `;

        await loadCompletedJobs();

    } catch (error) {

        console.error(error);

        message.innerHTML = `
            <div class="error">
                Unable to connect to the server.
            </div>
        `;
    }
}



function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


loadCompletedJobs();

</script>

</body>
</html>
